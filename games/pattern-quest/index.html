<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Pattern Quest — an ENGLISH YO! game. Read the picture pattern, choose what comes next, and learn 45 English words with Bahasa Indonesia meanings across five space planets." />
    <title>Pattern Quest — ENGLISH YO!</title>
    <link rel="icon" type="image/png" href="../../assets/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito+Sans:wght@600;700;800;900&display=swap" rel="stylesheet" />
    <style>
      :root {
        --void: #070c26;
        --navy: #101c52;
        --deep: #16255f;
        --sky: #5fd8ff;
        --mint: #6ef0bd;
        --gold: #ffd24a;
        --coral: #ff5f7e;
        --lilac: #b9a8ff;
        --paper: #f7fbff;
        --ink: #0d1c4d;
        --display: "Baloo 2", system-ui, cursive;
        --body: "Nunito Sans", system-ui, sans-serif;
        --ring: 0 0 0 4px rgba(255, 210, 74, 0.55);
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; }
      body {
        min-height: 100vh;
        min-height: 100dvh;
        color: var(--paper);
        font-family: var(--body);
        font-weight: 700;
        background:
          radial-gradient(ellipse at 14% 4%, rgba(84, 70, 200, 0.55), transparent 46%),
          radial-gradient(ellipse at 88% 92%, rgba(12, 132, 160, 0.45), transparent 44%),
          linear-gradient(160deg, #070c26 0%, #13205a 46%, #0a1030 100%);
        background-attachment: fixed;
        -webkit-tap-highlight-color: transparent;
      }
      #stars { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
      .shell { position: relative; z-index: 1; width: min(94%, 1180px); margin: 0 auto; padding-bottom: 46px; }
      img { display: block; max-width: 100%; height: auto; -webkit-user-drag: none; user-select: none; }
      button { font: inherit; cursor: pointer; border: 0; background: none; color: inherit; }
      button:focus-visible, a:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; border-radius: 16px; }
      h1, h2, h3 { font-family: var(--display); font-weight: 800; margin: 0; letter-spacing: -0.01em; }
      [hidden] { display: none !important; }
      .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }

      /* ---------- top bar ---------- */
      .topbar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 16px 0 6px; }
      .topbar .spacer { flex: 1 1 auto; }
      .chip {
        display: inline-flex; align-items: center; gap: 8px;
        padding: 9px 16px; border-radius: 999px;
        background: rgba(255, 255, 255, 0.12);
        border: 1px solid rgba(255, 255, 255, 0.24);
        color: #fff; font-weight: 900; font-size: 0.92rem;
        text-decoration: none; transition: background 0.18s ease, transform 0.18s ease;
      }
      .chip:hover { background: rgba(255, 255, 255, 0.22); transform: translateY(-2px); }
      .chip img { width: 22px; height: 22px; }
      .chip.on { background: var(--gold); color: #3a2a00; border-color: #ffe79a; }

      /* ---------- screens ---------- */
      .screen { display: none; animation: fade 0.35s ease both; }
      .screen.active { display: block; }
      @keyframes fade { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }

      .panel {
        background: rgba(11, 20, 62, 0.76);
        border: 1px solid rgba(150, 190, 255, 0.28);
        border-radius: 28px;
        padding: clamp(16px, 2.4vw, 26px);
        box-shadow: 0 18px 44px rgba(0, 0, 0, 0.34);
        backdrop-filter: blur(6px);
      }
      .paper {
        background: var(--paper);
        color: var(--ink);
        border-radius: 28px;
        padding: clamp(16px, 2.4vw, 26px);
        box-shadow: 0 16px 0 rgba(4, 12, 48, 0.28), 0 26px 60px rgba(0, 0, 0, 0.3);
      }

      /* ---------- home ---------- */
      .hero { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 0.92fr); gap: clamp(16px, 2.2vw, 28px); align-items: center; padding-top: 6px; }
      .hero-logo { width: min(100%, 460px); border-radius: 26px; box-shadow: 0 16px 40px rgba(0, 0, 0, 0.42); }
      .hero p { font-size: clamp(1rem, 1.4vw, 1.12rem); line-height: 1.5; color: #d9e6ff; margin: 14px 0 0; }
      .demo-strip { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-top: 18px; }
      .demo-tile {
        width: 62px; height: 62px; border-radius: 18px; background: #fff;
        display: grid; place-items: center; box-shadow: 0 6px 0 rgba(4, 12, 48, 0.35);
      }
      .demo-tile img { width: 46px; height: 46px; }
      .demo-tile.blank { background: #ffeaa8; color: #8a5a00; font-family: var(--display); font-size: 2rem; box-shadow: 0 6px 0 rgba(90, 60, 0, 0.35); }

      .section-title { font-size: clamp(1.15rem, 2vw, 1.5rem); margin-bottom: 12px; display: flex; align-items: center; gap: 10px; }
      .section-title img { width: 30px; height: 30px; }

      .crew { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
      .crew button {
        border-radius: 22px; overflow: hidden; padding: 0; position: relative;
        border: 3px solid rgba(255, 255, 255, 0.22); transition: transform 0.18s ease, border-color 0.18s ease;
      }
      .crew button:hover { transform: translateY(-4px); }
      .crew button[aria-pressed="true"] { border-color: var(--gold); box-shadow: 0 0 0 4px rgba(255, 210, 74, 0.28); }
      .crew img { width: 100%; aspect-ratio: 3 / 4; object-fit: cover; }
      .crew span {
        display: block; padding: 7px 4px; font-family: var(--display); font-weight: 800;
        background: rgba(6, 14, 50, 0.9); color: #fff; font-size: 0.95rem;
      }
      .crew small { display: block; font-family: var(--body); font-weight: 700; font-size: 0.72rem; color: #a9c2f5; }

      .worlds { display: grid; grid-template-columns: repeat(auto-fit, minmax(178px, 1fr)); gap: 14px; }
      .world {
        position: relative; border-radius: 24px; overflow: hidden; text-align: left;
        border: 3px solid rgba(255, 255, 255, 0.2); background: #0d1747;
        transition: transform 0.18s ease, border-color 0.18s ease;
      }
      .world:hover { transform: translateY(-5px); }
      .world[aria-pressed="true"] { border-color: var(--mint); box-shadow: 0 0 0 4px rgba(110, 240, 189, 0.26); }
      .world > img { width: 100%; aspect-ratio: 1 / 1.55; object-fit: cover; }
      .world-badge { position: absolute; top: 8px; left: 8px; width: 54px; height: 54px; filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.5)); }
      .world-foot { position: absolute; left: 0; right: 0; bottom: 0; padding: 10px 12px 12px; background: linear-gradient(transparent, rgba(4, 10, 40, 0.94) 38%); }
      .world-foot b { display: block; font-family: var(--display); font-size: 1.05rem; }
      .world-foot small { color: #ffdf88; font-size: 0.76rem; font-weight: 800; }

      .big-btn {
        display: inline-flex; align-items: center; justify-content: center; gap: 12px;
        width: 100%; padding: 18px 22px; border-radius: 22px;
        font-family: var(--display); font-size: clamp(1.1rem, 2vw, 1.4rem); font-weight: 800;
        background: linear-gradient(180deg, #ff7f96, #ff3f66); color: #fff;
        box-shadow: 0 8px 0 #b81f42; transition: transform 0.14s ease, box-shadow 0.14s ease;
      }
      .big-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 0 #b81f42; }
      .big-btn:active { transform: translateY(5px); box-shadow: 0 3px 0 #b81f42; }
      .big-btn img { width: 34px; height: 34px; }
      .big-btn.green { background: linear-gradient(180deg, #7bf0c4, #22c58d); color: #04372c; box-shadow: 0 8px 0 #10795a; }
      .big-btn.green:hover { box-shadow: 0 10px 0 #10795a; }
      .big-btn.green:active { box-shadow: 0 3px 0 #10795a; }
      .big-btn.ghost { background: #e9f0ff; color: var(--ink); box-shadow: 0 8px 0 #b7c8ea; }
      .big-btn.ghost:hover { box-shadow: 0 10px 0 #b7c8ea; }
      .big-btn.ghost:active { box-shadow: 0 3px 0 #b7c8ea; }

      .steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
      .steps li { display: flex; gap: 12px; align-items: flex-start; }
      .steps b { display: grid; place-items: center; flex: 0 0 auto; width: 34px; height: 34px; border-radius: 50%; background: var(--gold); color: #3a2a00; font-family: var(--display); }
      .steps span { color: #dfe9ff; font-size: 0.96rem; line-height: 1.45; }
      .steps strong { display: block; color: #fff; }

      /* ---------- game ---------- */
      .hud { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-bottom: 12px; }
      .hud-pilot { display: flex; align-items: center; gap: 10px; }
      .hud-pilot img { width: 52px; height: 52px; border-radius: 16px; object-fit: cover; border: 2px solid rgba(255, 255, 255, 0.35); }
      .hud-pilot b { display: block; font-family: var(--display); font-size: 1.1rem; }
      .hud-pilot small { color: #a9c2f5; font-size: 0.8rem; }
      .pill { display: inline-flex; align-items: center; gap: 7px; padding: 8px 14px; border-radius: 999px; background: rgba(255, 255, 255, 0.13); border: 1px solid rgba(255, 255, 255, 0.2); font-weight: 900; }
      .pill img { width: 24px; height: 24px; }
      .hearts { display: inline-flex; gap: 4px; }
      .hearts img { width: 26px; height: 26px; transition: opacity 0.25s ease, transform 0.25s ease; }
      .hearts img.lost { opacity: 0.22; transform: scale(0.8); filter: grayscale(1); }
      .track { height: 14px; border-radius: 999px; background: rgba(255, 255, 255, 0.16); overflow: hidden; margin-bottom: 16px; }
      .track > i { display: block; height: 100%; width: 0; border-radius: 999px; background: linear-gradient(90deg, #6ef0bd, #21bd88); transition: width 0.4s ease; }

      .board { display: grid; grid-template-columns: minmax(0, 1fr) 286px; gap: 16px; align-items: start; }
      .ask { font-size: clamp(1.2rem, 2.4vw, 1.75rem); color: var(--ink); }
      .ask-sub { color: #4c618a; font-size: 0.98rem; margin: 6px 0 0; }
      .pattern {
        display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: clamp(6px, 1.2vw, 12px);
        background: linear-gradient(180deg, #eef7ff, #e2effc); border: 3px solid #cfe3f7;
        border-radius: 24px; padding: clamp(12px, 2vw, 22px); margin: 18px 0;
      }
      .cell {
        width: clamp(58px, 9vw, 92px); height: clamp(58px, 9vw, 92px);
        border-radius: 20px; background: #fff; border: 3px solid #d7e6f7;
        display: grid; place-items: center; box-shadow: 0 5px 0 rgba(14, 50, 96, 0.13);
      }
      .cell img { width: 78%; height: 78%; object-fit: contain; }
      .cell.blank { background: #fff3cd; border: 3px dashed #e3a52a; color: #8a5a00; font-family: var(--display); font-size: clamp(1.6rem, 4vw, 2.4rem); animation: pulse 1.5s ease-in-out infinite; }
      .cell.filled { background: #ddfbec; border-color: #38b985; animation: none; }
      @keyframes pulse { 50% { transform: scale(1.06); } }
      .arrow { color: #8fa9c9; font-size: clamp(1rem, 2vw, 1.4rem); font-weight: 900; }

      .choices { display: grid; grid-template-columns: repeat(auto-fit, minmax(118px, 1fr)); gap: 12px; }
      .choice {
        border-radius: 22px; background: #fff; border: 3px solid #dde8f6; padding: 12px 10px 10px;
        display: grid; justify-items: center; gap: 6px; color: var(--ink);
        box-shadow: 0 6px 0 rgba(14, 50, 96, 0.15); transition: transform 0.16s ease, border-color 0.16s ease, background 0.16s ease;
      }
      .choice img { width: clamp(56px, 8vw, 76px); height: clamp(56px, 8vw, 76px); object-fit: contain; }
      .choice b { font-family: var(--display); font-size: 1.02rem; }
      .choice:hover { transform: translateY(-4px); border-color: var(--sky); background: #f0fbff; }
      .choice:disabled { cursor: default; }
      .choice.good { background: #d9f9ea; border-color: #2fae7c; }
      .choice.bad { background: #ffe3e7; border-color: #ef6d80; opacity: 0.72; }

      .feedback { margin-top: 16px; border-radius: 20px; padding: 14px 16px; font-weight: 800; display: flex; gap: 10px; align-items: center; }
      .feedback img { width: 32px; height: 32px; }
      .feedback.good { background: #ddf8ec; border: 2px solid #4cbd8d; color: #0c5b41; }
      .feedback.bad { background: #ffe4e8; border: 2px solid #f08a99; color: #9b2d43; }
      .hintbox { margin-top: 12px; border-radius: 20px; padding: 14px 16px; background: #fff5d6; border: 2px solid #efcd63; color: #79550d; font-weight: 800; }

      .actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 18px; }
      .actions button { flex: 1 1 180px; }
      .btn-gold { padding: 14px 20px; border-radius: 20px; background: linear-gradient(180deg, #ffe07a, #ffc21f); color: #4a3200; font-family: var(--display); font-size: 1.05rem; font-weight: 800; box-shadow: 0 7px 0 #c48d00; display: inline-flex; align-items: center; justify-content: center; gap: 10px; }
      .btn-gold:active { transform: translateY(4px); box-shadow: 0 3px 0 #c48d00; }
      .btn-gold img { width: 26px; height: 26px; }
      .btn-gold:disabled { opacity: 0.5; cursor: not-allowed; }

      .word-card { background: linear-gradient(180deg, #7bf0c4, #34cf99); color: #04372c; border-radius: 26px; padding: 18px; box-shadow: 0 12px 0 rgba(4, 60, 44, 0.32); }
      .word-card .label { font-size: 0.74rem; letter-spacing: 0.12em; font-weight: 900; opacity: 0.8; }
      .word-card .row { display: flex; align-items: center; gap: 14px; margin-top: 10px; }
      .word-card .row img { width: 72px; height: 72px; object-fit: contain; }
      .word-card .en { font-family: var(--display); font-size: 1.6rem; line-height: 1.1; }
      .word-card .id { font-size: 0.92rem; font-weight: 800; color: #0d5a45; }
      .speak { width: 100%; margin-top: 14px; padding: 12px; border-radius: 16px; background: rgba(255, 255, 255, 0.82); color: #04372c; font-weight: 900; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
      .speak:hover { background: #fff; }
      .mission-card { margin-top: 14px; }
      .mission-card img { width: 76px; height: 76px; margin: 0 auto 8px; }
      .mission-card b { display: block; font-family: var(--display); font-size: 1.15rem; text-align: center; }
      .mission-card p { margin: 6px 0 0; text-align: center; color: #c8d8fb; font-size: 0.88rem; line-height: 1.4; }

      /* ---------- result ---------- */
      .result { text-align: center; max-width: 720px; margin: 24px auto 0; }
      .result .stars { display: flex; justify-content: center; gap: 10px; margin: 0 0 8px; }
      .result .stars img { width: clamp(54px, 11vw, 82px); height: auto; animation: pop 0.45s ease both; }
      .result .stars img:nth-child(2) { animation-delay: 0.14s; }
      .result .stars img:nth-child(3) { animation-delay: 0.28s; }
      .result .stars img.off { opacity: 0.22; filter: grayscale(0.85); }
      @keyframes pop { from { transform: scale(0.4); opacity: 0; } 70% { transform: scale(1.12); } to { transform: scale(1); opacity: 1; } }
      .result h2 { font-size: clamp(1.7rem, 4vw, 2.6rem); color: var(--ink); }
      .scores { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin: 20px 0; }
      .scores div { background: #eef5ff; border-radius: 18px; padding: 12px 8px; }
      .scores img { width: 32px; height: 32px; margin: 0 auto 6px; }
      .scores small { display: block; color: #62769c; font-size: 0.7rem; letter-spacing: 0.06em; }
      .scores b { font-family: var(--display); font-size: 1.35rem; color: var(--ink); }
      .badge-won { display: flex; align-items: center; justify-content: center; gap: 12px; background: #fff5d6; border: 2px solid #efcd63; border-radius: 20px; padding: 12px; color: #79550d; }
      .badge-won img { width: 56px; height: 56px; }

      .toast {
        position: fixed; left: 50%; bottom: 22px; transform: translate(-50%, 24px);
        background: #fff; color: var(--ink); padding: 12px 20px; border-radius: 999px;
        font-weight: 900; box-shadow: 0 14px 30px rgba(0, 0, 0, 0.4); opacity: 0;
        transition: opacity 0.22s ease, transform 0.22s ease; pointer-events: none; z-index: 40;
      }
      .toast.show { opacity: 1; transform: translate(-50%, 0); }

      .float { animation: float 5s ease-in-out infinite; }
      @keyframes float { 50% { transform: translateY(-10px); } }

      @media (max-width: 900px) {
        .hero { grid-template-columns: 1fr; }
        .board { grid-template-columns: 1fr; }
        .crew { grid-template-columns: repeat(4, minmax(0, 1fr)); }
      }
      @media (max-width: 560px) {
        .topbar { gap: 8px; padding: 12px 0 4px; }
        .chip { padding: 7px 12px; font-size: 0.82rem; }
        .chip img { width: 18px; height: 18px; }
        .hud { gap: 8px; }
        .hud-pilot img { width: 42px; height: 42px; }
        .hud-pilot b { font-size: 1rem; }
        .pill { padding: 6px 11px; font-size: 0.92rem; }
        .pill img { width: 20px; height: 20px; }
        .hearts img { width: 22px; height: 22px; }
        .pattern { gap: 5px; }
        .cell { border-radius: 16px; }
        .arrow { font-size: 0.85rem; }
        .crew span { font-size: 0.8rem; }
        .crew small { display: none; }
        .scores { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      }
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation: none !important; transition: none !important; }
      }
    </style>
  </head>
  <body>
    <canvas id="stars" aria-hidden="true"></canvas>

    <div class="shell">
      <header class="topbar">
        <strong style="font-family: var(--display); font-size: 1.15rem">PATTERN QUEST</strong>
        <span class="spacer"></span>
        <button class="chip" id="btn-lang" type="button">🌐 <span id="lang-label">English</span></button>
        <button class="chip on" id="btn-sound" type="button" aria-pressed="true">
          <img src="assets/ui-sound-on.png" alt="" id="sound-icon" /><span id="sound-label">Sound on</span>
        </button>
        <a class="chip" href="../../games.html"><img src="assets/ui-rocket.png" alt="" /><span id="back-label">Games</span></a>
      </header>

      <!-- ================= HOME ================= -->
      <main id="screen-home" class="screen active">
        <section class="hero">
          <div>
            <img class="hero-logo" src="assets/logo.jpg" alt="Pattern Quest — Math × English Adventure" />
            <p id="home-intro"></p>
            <div class="demo-strip" aria-hidden="true">
              <span class="demo-tile"><img src="assets/apple.png" alt="" /></span>
              <span class="demo-tile"><img src="assets/banana.png" alt="" /></span>
              <span class="demo-tile"><img src="assets/apple.png" alt="" /></span>
              <span class="demo-tile"><img src="assets/banana.png" alt="" /></span>
              <span class="demo-tile blank">?</span>
            </div>
          </div>
          <div class="panel">
            <h2 class="section-title"><img src="assets/ui-hint.png" alt="" /><span id="how-title"></span></h2>
            <ol class="steps" id="how-list"></ol>
          </div>
        </section>

        <section class="panel" style="margin-top: 18px">
          <h2 class="section-title"><img src="assets/ui-star.png" alt="" /><span id="crew-title"></span></h2>
          <div class="crew" id="crew" role="group"></div>
        </section>

        <section class="panel" style="margin-top: 18px">
          <h2 class="section-title"><img src="assets/space-planet.png" alt="" /><span id="worlds-title"></span></h2>
          <div class="worlds" id="worlds" role="group"></div>
          <button class="big-btn" id="btn-start" type="button" style="margin-top: 18px">
            <img src="assets/ui-rocket.png" alt="" /><span id="start-label"></span>
          </button>
        </section>
      </main>

      <!-- ================= GAME ================= -->
      <main id="screen-play" class="screen">
        <div class="hud">
          <div class="hud-pilot">
            <img id="hud-avatar" src="assets/char-nova.jpg" alt="" />
            <div><b id="hud-name">Nova</b><small id="hud-world"></small></div>
          </div>
          <span class="spacer" style="flex: 1 1 auto"></span>
          <span class="pill"><img src="assets/ui-star.png" alt="" /><span id="hud-score">0</span></span>
          <span class="pill"><img src="assets/ui-speed.png" alt="" /><span id="hud-streak">0</span></span>
          <span class="pill hearts" id="hud-hearts" aria-label="lives"></span>
        </div>
        <div class="track"><i id="hud-progress"></i></div>

        <div class="board">
          <section class="paper">
            <h1 class="ask" id="ask"></h1>
            <p class="ask-sub" id="ask-sub"></p>
            <div class="pattern" id="pattern" role="img" aria-label=""></div>
            <h2 style="font-size: 1.05rem; color: #2c3e66" id="choose-title"></h2>
            <div class="choices" id="choices" style="margin-top: 10px"></div>
            <div class="feedback" id="feedback" hidden></div>
            <div class="hintbox" id="hintbox" hidden></div>
            <div class="actions">
              <button class="btn-gold" id="btn-hint" type="button"><img src="assets/ui-hint.png" alt="" /><span id="hint-label"></span></button>
              <button class="big-btn green" id="btn-next" type="button" hidden><span id="next-label"></span> →</button>
            </div>
          </section>

          <aside>
            <div class="word-card">
              <span class="label" id="word-label"></span>
              <div class="row">
                <img id="word-icon" src="assets/apple.png" alt="" />
                <div>
                  <div class="en" id="word-en">?</div>
                  <div class="id" id="word-id"></div>
                </div>
              </div>
              <button class="speak" id="btn-speak" type="button">🔊 <span id="speak-label"></span></button>
            </div>
            <div class="panel mission-card">

      <!-- ================= RESULT ================= -->

        <section class="paper result">
          <div class="stars" id="res-stars" role="img" aria-label=""></div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script>
      /* =============== data =============== */
      const WORDS = {
        apple: ["apple", "apel"], banana: ["banana", "pisang"], orange: ["orange", "jeruk"],

        calculator: ["calculator", "kalkulator"], scissors: ["scissors", "gunting"], lamp: ["lamp", "lampu"],
        chair: ["chair", "kursi"], table: ["table", "meja"], sofa: ["sofa", "sofa"], bed: ["bed", "tempat tidur"],

      const CREW = [
        { key: "nova", name: "Nova", role: { en: "The Explorer", id: "Sang Penjelajah" } },

      const WORLDS = [
        {

        },
        {

          pool: ["chair", "table", "sofa", "bed", "pillow", "cup", "plate", "spoon", "towel", "clock"],
          rules: ["AAB", "ABB"], options: 3, middle: false
        },
        {
          key: "park", card: "planet-park.jpg", map: "map-park.png",
          name: { en: "Planet Park", id: "Planet Taman" },
          tag: { en: "Level 3 • ABC patterns", id: "Level 3 • Pola ABC" },
          desc: { en: "Three park friends take turns, again and again.", id: "Tiga teman taman bergantian, berulang-ulang." },
          pool: ["ball", "bicycle", "tree", "flower", "plant", "cat", "dog", "bird", "butterfly"],
          rules: ["ABC"], options: 4, middle: false
        },
        {
          key: "market", card: "planet-market.jpg", map: "map-market.png",
          name: { en: "Planet Market", id: "Planet Pasar" },
          tag: { en: "Level 4 • AABB patterns", id: "Level 4 • Pola AABB" },
          desc: { en: "Market baskets grow in pairs. Watch the rhythm closely.", id: "Keranjang pasar berpasangan. Perhatikan iramanya." },
          pool: ["apple", "banana", "orange", "bread", "egg", "basket", "bottle", "cup"],
          rules: ["AABB", "ABBC", "AAB"], options: 4, middle: false
        },
        {
          key: "city", card: "planet-city.jpg", map: "map-city.png",
          name: { en: "Planet City", id: "Planet Kota" },
          tag: { en: "Level 5 • Master patterns", id: "Level 5 • Pola Master" },
          desc: { en: "City patterns are long and tricky — and the gap can hide anywhere!", id: "Pola kota panjang dan rumit — kotak kosongnya bisa di mana saja!" },
          pool: ["car", "bus", "traffic-light", "bicycle", "camera", "glasses", "shoes", "jacket", "laptop", "keyboard"],
          rules: ["ABAC", "ABCD", "AABB", "ABC"], options: 4, middle: true
        }
      ];

      const T = {
        en: {
          langName: "English", soundOn: "Sound on", soundOff: "Sound off", back: "Games",
          intro: "Look at the picture pattern, then choose what comes next. Every right answer teaches you a new English word — with its meaning in Bahasa Indonesia and how to say it out loud.",
          howTitle: "How to play",
          steps: [
            ["Pick your pilot", "Choose Nova, Luna, Zee or Mira for this mission."],
            ["Choose a planet", "Each planet has its own words and its own pattern rule."],
            ["Read the pattern", "Say the pictures out loud: apple, banana, apple, banana…"],
            ["Tap what comes next", "Tap the picture that fills the yellow box. You have 3 lives."]
          ],
          crewTitle: "Choose your pilot", worldsTitle: "Choose your planet", start: "Launch mission",
          ask: "What comes next?", askMiddle: "What is missing?",
          askSub: "Say the pattern out loud, then tap the picture that fits the yellow box.",
          choose: "Tap one picture", hint: "Show hint", next: "Next challenge", last: "See my stars",
          wordLabel: "WORD POWER", speak: "Hear the word", quit: "← Leave mission",
          correct: "Correct! Great pattern reading.", correctAgain: "Yes! That is the one.",
          wrong: "Not yet. Look again at how the pictures repeat.",
          hintText: (u) => "The pattern repeats: " + u + " — then it starts again.",
          challenge: (a, b) => "Challenge " + a + " of " + b,
          resTitleWin: "MISSION COMPLETE!", resTitleLose: "MISSION OVER",
          resSubWin: (n) => "Brilliant flying, Pilot " + n + "!",
          resSubLose: (n) => "Good try, Pilot " + n + ". Every pilot practises!",
          score: "STARS", correctLabel: "CORRECT", streakLabel: "BEST STREAK", lives: "LIVES LEFT",
          again: "Play this planet again", home: "Back to mission control",
          badges: { explorer: "Explorer badge — keep exploring!", learner: "Learner badge — you are getting it!", thinker: "Thinker badge — sharp pattern eyes!", achiever: "Achiever badge — Pattern Master!" },
          leftMission: "Mission cancelled. Back at mission control."
        },
        id: {
          langName: "Bahasa Indonesia", soundOn: "Suara aktif", soundOff: "Suara mati", back: "Permainan",
          intro: "Lihat pola gambarnya, lalu pilih gambar berikutnya. Setiap jawaban benar mengajarkan kata bahasa Inggris baru — lengkap dengan artinya dan cara mengucapkannya.",
          howTitle: "Cara bermain",
          steps: [
            ["Pilih pilotmu", "Pilih Nova, Luna, Zee, atau Mira untuk misi ini."],
            ["Pilih planet", "Setiap planet punya kosakata dan aturan polanya sendiri."],
            ["Baca polanya", "Ucapkan gambarnya: apple, banana, apple, banana…"],
            ["Ketuk gambar berikutnya", "Ketuk gambar yang mengisi kotak kuning. Kamu punya 3 nyawa."]
          ],
          crewTitle: "Pilih pilotmu", worldsTitle: "Pilih planetmu", start: "Mulai misi",
          ask: "Gambar apa selanjutnya?", askMiddle: "Gambar apa yang hilang?",
          askSub: "Ucapkan polanya dengan keras, lalu ketuk gambar yang cocok untuk kotak kuning.",
          choose: "Ketuk satu gambar", hint: "Lihat petunjuk", next: "Tantangan berikutnya", last: "Lihat bintangku",
          wordLabel: "KATA HEBAT", speak: "Dengarkan katanya", quit: "← Keluar dari misi",
          correct: "Benar! Kamu pandai membaca pola.", correctAgain: "Ya! Itu jawabannya.",
          wrong: "Belum tepat. Lihat lagi urutan gambarnya.",
          hintText: (u) => "Polanya berulang: " + u + " — lalu dimulai lagi.",
          challenge: (a, b) => "Tantangan " + a + " dari " + b,
          resTitleWin: "MISI SELESAI!", resTitleLose: "MISI BERAKHIR",
          resSubWin: (n) => "Terbang yang hebat, Pilot " + n + "!",
          resSubLose: (n) => "Usaha bagus, Pilot " + n + ". Semua pilot perlu latihan!",
          score: "BINTANG", correctLabel: "BENAR", streakLabel: "RENTETAN TERBAIK", lives: "SISA NYAWA",
          again: "Main planet ini lagi", home: "Kembali ke pusat misi",
          badges: { explorer: "Lencana Explorer — terus menjelajah!", learner: "Lencana Learner — kamu makin paham!", thinker: "Lencana Thinker — matamu jeli!", achiever: "Lencana Achiever — Master Pola!" },
          leftMission: "Misi dibatalkan. Kembali ke pusat misi."
        }
      };

      const ROUNDS = 8;
      const $ = (id) => document.getElementById(id);
      let lang = "en";
      let soundOn = true;
      let pilot = 0;
      let world = 0;
      let game = null;
      let audio;
      let toastTimer;
      const t = () => T[lang];

      /* =============== helpers =============== */
      const shuffle = (a) => { const c = [...a]; for (let i = c.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [c[i], c[j]] = [c[j], c[i]]; } return c; };
      const pick = (a) => a[Math.floor(Math.random() * a.length)];
      const wordEn = (k) => WORDS[k][0];
      const wordId = (k) => WORDS[k][1];

      function tone(kind) {
        if (!soundOn) return;
        try {
          audio = audio || new (window.AudioContext || window.webkitAudioContext)();
          const map = { tap: [430, 0.07, "sine"], good: [720, 0.18, "sine"], up: [980, 0.16, "triangle"], bad: [170, 0.2, "sawtooth"], win: [560, 0.3, "triangle"] };
          const [f, d, type] = map[kind] || map.tap;
          const o = audio.createOscillator(), g = audio.createGain();
          o.type = type; o.frequency.value = f;
          g.gain.setValueAtTime(0.07, audio.currentTime);
          g.gain.exponentialRampToValueAtTime(0.001, audio.currentTime + d);
          o.connect(g); g.connect(audio.destination);
          o.start(); o.stop(audio.currentTime + d);
        } catch (e) { /* no audio available */ }
      }

      function say(text) {
        if (!("speechSynthesis" in window)) return;
        window.speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(text);
        u.lang = "en-GB"; u.rate = 0.82; u.pitch = 1.05;
        window.speechSynthesis.speak(u);
      }

      function toast(msg) {
        const el = $("toast");
        el.textContent = msg; el.classList.add("show");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => el.classList.remove("show"), 2400);
      }

      function show(screen) {
        document.querySelectorAll(".screen").forEach((s) => s.classList.remove("active"));
        $(screen).classList.add("active");
        window.scrollTo({ top: 0, behavior: "smooth" });
      }

      /* =============== starfield =============== */
      (function starfield() {
        const c = $("stars"), ctx = c.getContext("2d");
        let dots = [];
        function build() {
          c.width = window.innerWidth; c.height = window.innerHeight;
          const n = Math.round((c.width * c.height) / 9000);
          dots = Array.from({ length: n }, () => ({
            x: Math.random() * c.width, y: Math.random() * c.height,
            r: Math.random() * 1.6 + 0.3, a: Math.random(), s: Math.random() * 0.02 + 0.004
          }));
        }
        function draw() {
          ctx.clearRect(0, 0, c.width, c.height);
          for (const d of dots) {
            d.a += d.s; const alpha = 0.35 + Math.abs(Math.sin(d.a)) * 0.6;
            ctx.fillStyle = "rgba(255,255,255," + alpha.toFixed(2) + ")";
            ctx.beginPath(); ctx.arc(d.x, d.y, d.r, 0, 6.3); ctx.fill();
          }
          requestAnimationFrame(draw);
        }
        build(); draw();
        window.addEventListener("resize", build);
      })();

      /* =============== home =============== */
      function buildHome() {
        const crew = $("crew");
        crew.innerHTML = "";
        CREW.forEach((c, i) => {
          const b = document.createElement("button");
          b.type = "button";
          b.setAttribute("aria-pressed", String(i === pilot));
          b.innerHTML =
            '<img src="assets/char-' + c.key + '.jpg" alt="" />' +
            "<span>" + c.name + "<small>" + c.role[lang] + "</small></span>";
          b.setAttribute("aria-label", c.name + " — " + c.role[lang]);
          b.addEventListener("click", () => { pilot = i; tone("tap"); buildHome(); });
          crew.appendChild(b);
        });

        const w = $("worlds");
        w.innerHTML = "";
        WORLDS.forEach((wd, i) => {
          const b = document.createElement("button");
          b.type = "button"; b.className = "world";
          b.setAttribute("aria-pressed", String(i === world));
          b.innerHTML =
            '<img src="assets/' + wd.card + '" alt="" />' +
            '<img class="world-badge" src="assets/' + wd.map + '" alt="" />' +
            '<span class="world-foot"><b>' + wd.name[lang] + "</b><small>" + wd.tag[lang] + "</small></span>";
          b.setAttribute("aria-label", wd.name[lang] + " — " + wd.tag[lang]);
          b.addEventListener("click", () => { world = i; tone("tap"); buildHome(); });
          w.appendChild(b);
        });

        const list = $("how-list");
        list.innerHTML = "";
        t().steps.forEach((s, i) => {
          const li = document.createElement("li");
          li.innerHTML = "<b>" + (i + 1) + "</b><span><strong>" + s[0] + "</strong>" + s[1] + "</span>";
          list.appendChild(li);
        });

        $("home-intro").textContent = t().intro;
        $("how-title").textContent = t().howTitle;
        $("crew-title").textContent = t().crewTitle;
        $("worlds-title").textContent = t().worldsTitle;
        $("start-label").textContent = t().start;
        $("lang-label").textContent = t().langName;
        $("sound-label").textContent = soundOn ? t().soundOn : t().soundOff;
        $("back-label").textContent = t().back;
      }

      /* =============== pattern engine =============== */
      function makeChallenge(wd) {
        const rule = pick(wd.rules);
        const letters = [...new Set(rule.split(""))];
        const chosen = shuffle(wd.pool).slice(0, letters.length);
        const map = {};
        letters.forEach((l, i) => (map[l] = chosen[i]));
        const unit = rule.split("").map((l) => map[l]);

        const minLen = unit.length * 2 + 1;
        const len = Math.min(9, minLen + (Math.random() < 0.5 ? 0 : unit.length > 3 ? 0 : 1));
        const seq = [];
        while (seq.length < len) seq.push(unit[seq.length % unit.length]);

        let blank = len - 1;
        if (wd.middle && Math.random() < 0.5) {
          const from = unit.length * 2;
          blank = from + Math.floor(Math.random() * Math.max(1, len - from));
        }
        const answer = seq[blank];

        const distractPool = shuffle([...new Set([...chosen, ...wd.pool])].filter((k) => k !== answer));
        const options = shuffle([answer, ...distractPool.slice(0, wd.options - 1)]);
        return { seq, blank, answer, unit, options };
      }

      /* =============== game flow =============== */
      function startGame() {
        const wd = WORLDS[world];
        game = { wd: wd, index: 0, score: 0, correct: 0, streak: 0, best: 0, lives: 3, tries: 0, ch: null, solved: false };
        $("hud-avatar").src = "assets/char-" + CREW[pilot].key + ".jpg";
        $("hud-name").textContent = CREW[pilot].name;
        $("mission-icon").src = "assets/" + wd.map;
        show("screen-play");
        loadChallenge();
      }

      function loadChallenge() {
        const wd = game.wd;
        game.ch = makeChallenge(wd);
        game.solved = false;
        game.tries = 0;
        $("feedback").hidden = true;
        $("hintbox").hidden = true;
        $("btn-next").hidden = true;
        $("btn-hint").disabled = false;
        renderPlay();
      }

      function renderPlay() {
        const wd = game.wd, ch = game.ch, L = t();
        $("hud-world").textContent = L.challenge(game.index + 1, ROUNDS);
        $("hud-score").textContent = game.score;
        $("hud-streak").textContent = game.streak;
        $("hud-progress").style.width = (game.index / ROUNDS) * 100 + "%";
        $("mission-name").textContent = wd.name[lang];
        $("mission-desc").textContent = wd.desc[lang];
        $("ask").textContent = ch.blank === ch.seq.length - 1 ? L.ask : L.askMiddle;
        $("ask-sub").textContent = L.askSub;
        $("choose-title").textContent = L.choose;
        $("hint-label").textContent = L.hint;
        $("next-label").textContent = game.index === ROUNDS - 1 ? L.last : L.next;
        $("word-label").textContent = L.wordLabel;
        $("speak-label").textContent = L.speak;
        $("quit-label").textContent = L.quit;

        const strip = $("pattern");
        strip.innerHTML = "";
        ch.seq.forEach((key, i) => {
          if (i) {
            const ar = document.createElement("span");
            ar.className = "arrow"; ar.setAttribute("aria-hidden", "true"); ar.textContent = "→";
            strip.appendChild(ar);
          }
          const cell = document.createElement("span");
          if (i === ch.blank && !game.solved) {
            cell.className = "cell blank"; cell.textContent = "?";
          } else {
            cell.className = "cell" + (i === ch.blank ? " filled" : "");
            cell.innerHTML = '<img src="assets/' + key + '.png" alt="' + wordEn(key) + '" />';
          }
          strip.appendChild(cell);
        });
        strip.setAttribute(
          "aria-label",
          ch.seq.map((k, i) => (i === ch.blank && !game.solved ? "?" : wordEn(k))).join(", ")
        );

        const box = $("choices");
        box.innerHTML = "";
        ch.options.forEach((key, i) => {
          const b = document.createElement("button");
          b.type = "button"; b.className = "choice"; b.dataset.key = key;
          b.innerHTML = '<img src="assets/' + key + '.png" alt="" /><b>' + wordEn(key) + "</b>";
          b.setAttribute("aria-label", (i + 1) + ". " + wordEn(key));
          b.addEventListener("click", () => answer(key, b));
          if (game.solved) {
            b.disabled = true;
            if (key === ch.answer) b.classList.add("good");
          }
          box.appendChild(b);
        });

        setWordCard(ch.answer, game.solved);
        renderHearts();
      }

      function setWordCard(key, reveal) {
        $("word-icon").src = "assets/" + (reveal ? key : "ui-star") + ".png";
        $("word-en").textContent = reveal ? wordEn(key) : "? ? ?";
        $("word-id").textContent = reveal ? wordId(key) : "";
        $("btn-speak").disabled = !reveal;
        $("btn-speak").style.opacity = reveal ? "1" : "0.55";
      }

      function renderHearts() {
        const h = $("hud-hearts");
        h.innerHTML = "";
        for (let i = 0; i < 3; i++) {
          const img = document.createElement("img");
          img.src = "assets/ui-heart.png"; img.alt = "";
          if (i >= game.lives) img.className = "lost";
          h.appendChild(img);
        }
      }

      function answer(key, btn) {
        if (game.solved) return;
        const ch = game.ch, L = t();
        if (key === ch.answer) {
          game.solved = true;
          game.correct++;
          game.streak++;
          game.best = Math.max(game.best, game.streak);
          const base = game.tries === 0 ? 100 : 50;
          const bonus = game.streak > 1 ? 25 : 0;
          game.score += base + bonus;
          btn.classList.add("good");
          document.querySelectorAll(".choice").forEach((c) => (c.disabled = true));
          const fb = $("feedback");
          fb.className = "feedback good";
          fb.innerHTML = '<img src="assets/ui-star.png" alt="" /><span>' +
            (game.tries === 0 ? L.correct : L.correctAgain) + " +" + (base + bonus) + "</span>";
          fb.hidden = false;
          $("btn-next").hidden = false;
          $("btn-hint").disabled = true;
          tone("good");
          renderPlay();
          say(wordEn(ch.answer));
          $("btn-next").focus();
        } else {
          game.tries++;
          game.streak = 0;
          game.lives--;
          btn.classList.add("bad");
          btn.disabled = true;
          const fb = $("feedback");
          fb.className = "feedback bad";
          fb.innerHTML = '<img src="assets/ui-heart.png" alt="" /><span>' + L.wrong + "</span>";
          fb.hidden = false;
          tone("bad");
          renderHearts();
          $("hud-streak").textContent = game.streak;
          if (game.lives <= 0) setTimeout(() => finish(false), 700);
        }
      }

      function nextChallenge() {
        tone("up");
        game.index++;
        if (game.index >= ROUNDS) finish(true);
        else loadChallenge();
      }

      function finish(won) {
        const L = t();
        const maxScore = ROUNDS * 125;
        const ratio = game.score / maxScore;
        let stars = 1, badge = "explorer", badgeKey = "explorer";
        if (!won && game.correct < 3) { stars = 1; badgeKey = "explorer"; }
        else if (ratio >= 0.8) { stars = 3; badgeKey = "achiever"; }
        else if (ratio >= 0.5) { stars = 2; badgeKey = "thinker"; }
        else { stars = 1; badgeKey = "learner"; }
        badge = badgeKey;

        const starBox = $("res-stars");
        starBox.innerHTML = "";
        for (let i = 0; i < 3; i++) {
          const img = document.createElement("img");
          img.src = "assets/ui-star.png"; img.alt = "";
          if (i >= stars) img.className = "off";
          starBox.appendChild(img);
        }
        starBox.setAttribute("aria-label", stars + " / 3");
        $("res-title").textContent = won ? L.resTitleWin : L.resTitleLose;
        $("res-sub").textContent = won ? L.resSubWin(CREW[pilot].name) : L.resSubLose(CREW[pilot].name);
        $("res-score").textContent = game.score;
        $("res-correct").textContent = game.correct + "/" + ROUNDS;
        $("res-streak").textContent = game.best;
        $("res-lives").textContent = Math.max(0, game.lives);
        $("lab-score").textContent = L.score;
        $("lab-correct").textContent = L.correctLabel;
        $("lab-streak").textContent = L.streakLabel;
        $("lab-lives").textContent = L.lives;
        $("res-badge").src = "assets/badge-" + badge + ".png";
        $("res-badge-text").textContent = L.badges[badgeKey];
        $("again-label").textContent = L.again;
        $("home-label").textContent = L.home;
        tone("win");
        show("screen-done");
      }

      /* =============== wiring =============== */
      document.addEventListener("DOMContentLoaded", () => {
        buildHome();

        $("btn-lang").addEventListener("click", () => {
          lang = lang === "en" ? "id" : "en";
          document.documentElement.lang = lang;
          tone("tap");
          buildHome();
          if ($("screen-play").classList.contains("active")) renderPlay();
          if ($("screen-done").classList.contains("active")) finish(game && game.lives > 0);
        });

        $("btn-sound").addEventListener("click", () => {
          soundOn = !soundOn;
          $("btn-sound").setAttribute("aria-pressed", String(soundOn));
          $("btn-sound").classList.toggle("on", soundOn);
          $("sound-icon").src = soundOn ? "assets/ui-sound-on.png" : "assets/ui-sound-off.png";
          $("sound-label").textContent = soundOn ? t().soundOn : t().soundOff;
          if (soundOn) tone("tap");
        });

        $("btn-start").addEventListener("click", () => { tone("up"); startGame(); });
        $("btn-next").addEventListener("click", nextChallenge);
        $("btn-again").addEventListener("click", () => { tone("up"); startGame(); });
        $("btn-home").addEventListener("click", () => { tone("tap"); show("screen-home"); });
        $("btn-quit").addEventListener("click", () => { tone("tap"); show("screen-home"); toast(t().leftMission); });

        $("btn-hint").addEventListener("click", () => {
          if (!game || !game.ch) return;
          const unit = game.ch.unit.map(wordEn).join(" · ");
          $("hintbox").textContent = "💡 " + t().hintText(unit);
          $("hintbox").hidden = false;
          $("btn-hint").disabled = true;
          tone("tap");
        });

        $("btn-speak").addEventListener("click", () => {
          if (game && game.solved) { tone("tap"); say(wordEn(game.ch.answer)); }
        });

        document.addEventListener("keydown", (e) => {
          if (!$("screen-play").classList.contains("active")) return;
          if (e.key >= "1" && e.key <= "4") {
            const b = document.querySelectorAll(".choice")[Number(e.key) - 1];
            if (b && !b.disabled) b.click();
          }
          if (e.key === "Enter" && !$("btn-next").hidden) nextChallenge();
        });

        // warm the image cache so the first challenge appears instantly
        Object.keys(WORDS).forEach((k) => { const i = new Image(); i.src = "assets/" + k + ".png"; });
      });
    </script>
  </body>
</html>
